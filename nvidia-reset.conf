# Configuration for nvidia-reset.
#
# By default nvidia-reset autodetects your setup: if the systemd alias
# "display-manager.service" resolves to a real unit, that unit is stopped
# and restarted around the driver reload. If it doesn't resolve (e.g. you
# launch your session with startx/.xinitrc from a TTY, or your DM doesn't
# register the alias), nvidia-reset instead terminates your active
# graphical login session directly and you restart it manually afterward.
#
# Uncomment to force a specific display manager unit, e.g. if the alias
# resolves to the wrong thing. Check what your system provides with:
#   systemctl cat display-manager.service
#
#DM_UNIT=sddm.service
