# Configuration for nvidia-reset.
#
# By default nvidia-reset autodetects your setup: if the systemd alias
# "display-manager.service" resolves to a real unit, that unit is stopped
# and restarted around the driver reload. If it doesn't resolve (e.g. you
# launch your session with startx/.xinitrc from a TTY, or your DM doesn't
# register the alias), nvidia-reset instead terminates your active
# graphical login session directly and you restart it manually afterward.
#
# Uncomment to force a specific display manager unit, e.g. if the alias
# resolves to the wrong thing. Check what your system provides with:
#   systemctl cat display-manager.service
#
#DM_UNIT=sddm.service

# One-shot autologin (opt-in): skip the password prompt when your display
# manager comes back up after a reset. Managed by `nvidia-reset
# --enable-autologin` / `--disable-autologin`, which require authentication
# to flip -- don't hand-edit this line, it's rewritten by those commands.
# It's genuinely one-shot: nvidia-reset writes the autologin config for
# whoever was logged in immediately before stopping the display manager, and
# removes it again as soon as that session reappears, so ordinary logins
# still ask for a password. Supported for sddm, gdm, lightdm, and
# plasmalogin; unknown or unrecognized display managers just skip it and
# fall back to the normal login prompt.
ONESHOT_AUTOLOGIN=no

# greetd has no notion of a user's "last session" to fall back to, so if
# your display manager is greetd and you want one-shot autologin, tell it
# what command to launch (whatever your greeter would normally run for you,
# e.g. "Hyprland" or "sway"). Leave unset to skip autologin under greetd.
#AUTOLOGIN_GREETD_COMMAND=Hyprland
